<!doctype html>
<meta charset="utf-8">
<title>WebGL test</title>
<style>body{margin:0;background:#111;color:#eee;font:16px system-ui}canvas{display:block}#out{padding:12px;white-space:pre-wrap}</style>
<canvas id="c" width="960" height="540"></canvas>
<div id="out">menunggu...</div>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js"
  }
}
</script>
<script type="module">
const out = document.getElementById('out');
const lines = [];
const log = (t) => { lines.push(t); out.textContent = lines.join('\n'); };

try {
  const probe = document.createElement('canvas');
  const testGl = probe.getContext('webgl2') || probe.getContext('webgl');
  log('WebGL tersedia : ' + (testGl ? 'ya' : 'TIDAK'));
  if (testGl) {
    log('renderer       : ' + testGl.getParameter(testGl.RENDERER));
    log('vendor         : ' + testGl.getParameter(testGl.VENDOR));
    log('version        : ' + testGl.getParameter(testGl.VERSION));
  }

  const THREE = await import('three');
  log('three.js       : ' + THREE.REVISION);

  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.setSize(960, 540, false);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2a3a4a);

  const camera = new THREE.PerspectiveCamera(60, 960 / 540, 0.1, 200);
  camera.position.set(6, 5, 9);
  camera.lookAt(0, 1, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const key = new THREE.DirectionalLight(0xffffff, 2.2);
  key.position.set(6, 12, 8);
  scene.add(key);

  const box = new THREE.Mesh(
    new THREE.BoxGeometry(3, 3, 3),
    new THREE.MeshStandardMaterial({ color: 0xf0a830, roughness: 0.4 })
  );
  box.position.y = 1.5;
  scene.add(box);

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 30),
    new THREE.MeshStandardMaterial({ color: 0x445566 })
  );
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  renderer.render(scene, camera);

  // read a pixel from the middle of the box
  const gl = renderer.getContext();
  const px = new Uint8Array(4);
  gl.readPixels(480, 300, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  log('piksel tengah  : [' + [...px].join(',') + ']');

  // a real scene has many shades
  const px2 = new Uint8Array(4);
  const shades = new Set();
  for (let x = 0; x < 960; x += 40) {
    for (let y = 0; y < 540; y += 40) {
      gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px2);
      shades.add((px2[0] >> 3) << 10 | (px2[1] >> 3) << 5 | px2[2] >> 3);
    }
  }
  log('jumlah shade   : ' + shades.size);

  const drew = px[0] > 100 || px[1] > 100 || px[2] > 40 || shades.size > 8;
  log('');
  log(drew ? 'HASIL: WebGL MENGGAMBAR dengan baik di mesin ini.'
           : 'HASIL: WebGL TIDAK menggambar. Ini penyebabnya.');
  window.__done = true;
} catch (err) {
  log('GAGAL: ' + err.message);
  window.__done = true;
}
</script>
